on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest

    steps:
      - name: Ping .NET API on Render
        env:
          API_URL: ${{ secrets.RENDER_API_URL }}
        run: |
          if [ -z "$API_URL" ]; then
            echo "RENDER_API_URL secret is missing"
            exit 1
          fi

          curl --fail --silent --show-error \
            --max-time 60 "$API_URL"